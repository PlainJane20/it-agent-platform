[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "it-agent-platform"
version = "0.1.0"
description = "Approval-first multi-agent automation starter for IT operations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Navi Sohi"}]
keywords = ["ai-agents", "it-automation", "fastapi", "human-in-the-loop", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.100,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/PlainJane20/it-agent-platform"
Documentation = "https://github.com/PlainJane20/it-agent-platform#readme"
Issues = "https://github.com/PlainJane20/it-agent-platform/issues"
Repository = "https://github.com/PlainJane20/it-agent-platform.git"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
it-agent-api = "it_agent_platform.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/it_agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP045"]
